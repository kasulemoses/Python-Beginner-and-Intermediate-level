name: Web learning application
on:
  push:
    paths: ["python_for_web/**", "22_Day_Web_scraping/**", "26_Day_Python_web/**", "27_Day_Python_with_mongodb/**", "28_Day_API/**", "29_Day_Building_API/**", ".github/workflows/web-learning.yml"]
  pull_request:
    paths: ["python_for_web/**", "22_Day_Web_scraping/**", "26_Day_Python_web/**", "27_Day_Python_with_mongodb/**", "28_Day_API/**", "29_Day_Building_API/**", ".github/workflows/web-learning.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: python_for_web/frontend/package-lock.json
      - name: Install Python dependencies
        working-directory: python_for_web/backend
        run: python -m pip install -r requirements.lock
      - name: Test Python and MongoDB
        working-directory: python_for_web/backend
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
        run: python -m pytest -q
      - name: Install frontend
        working-directory: python_for_web/frontend
        run: npm ci
      - name: Type check and build
        working-directory: python_for_web/frontend
        run: npm run typecheck && npm run build
      - name: Install browser
        working-directory: python_for_web/frontend
        run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          cd python_for_web/backend
          MONGODB_URI=mongodb://127.0.0.1:27017 MONGODB_DATABASE=python_learning_browser_ci python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/python-api.log 2>&1 &
          cd ../frontend
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/python-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready && curl -fsS http://127.0.0.1:3000/; then exit 0; fi
            sleep 1
          done
          cat /tmp/python-api.log /tmp/python-web.log
          exit 1
      - name: Browser workflows
        working-directory: python_for_web/frontend
        run: npm test
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: python_for_web/frontend/test-results
